# Managed by YukiPan. Certificate paths become valid after the initial
# certbot issuance for pan.yeastar.xin.
# This file is included inside nginx's http block (sites-enabled),
# so limit_conn_zone is legal here.

# 访客空间下载的每 IP 并发限制；单连接速率在对应 location 里用 limit_rate 卡
limit_conn_zone $binary_remote_addr zone=yukipan_guest_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name pan.yeastar.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pan.yeastar.xin;

    root /var/www/yukipan/current/web;
    index index.html;

    # 私有区无单文件上限，server 级放宽；访客上传口在下面单独卡 50m
    client_max_body_size 16g;

    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    ssl_certificate /etc/letsencrypt/live/pan.yeastar.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pan.yeastar.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YukiPanTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 前端未定档，先按无内联脚本的 SPA 收紧 script-src；图床图片全部同源直出
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 图床公开图片直出（区目录内是 blob 的 hardlink，唯一真源在磁盘）
    location ^~ /public/images/ {
        alias /var/lib/yukipan/public/images/;
        expires 1y;
    }

    # 图床缩略图直出 (长边 640 webp), 与 images 同档, 名字稳定可加缓存
    location ^~ /public/thumbs/ {
        alias /var/lib/yukipan/public/thumbs/;
        expires 1y;
    }

    # 访客空间下载直出；限每 IP 并发与单连接速率防风暴。
    # 不放 add_header，保持继承 server 级安全头（含 nosniff）
    location ^~ /public/guest/ {
        alias /var/lib/yukipan/public/guest/;
        limit_conn yukipan_guest_conn 4;
        limit_rate 2m;
    }

    # 私有区文件仅供后端鉴权后 X-Accel-Redirect 内部跳转，外部不可达
    location ^~ /protected/ {
        internal;
        alias /var/lib/yukipan/private/;
    }

    # 访客上传单独卡 50m，其余上传走 server 级 16g
    location = /api/guest/upload {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8516;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大文件流式上传，关掉请求缓冲，不经过后端内存整读
    location /api/ {
        proxy_pass http://127.0.0.1:8516;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
