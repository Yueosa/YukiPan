[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "migrate",
    "macros",
    "uuid",
    "json",
    "chrono",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }

yukipan-api = { path = "crates/app/yukipan-api" }
yukipan-config = { path = "crates/infra/yukipan-config" }
yukipan-core = { path = "crates/app/yukipan-core" }
yukipan-db = { path = "crates/infra/yukipan-db" }
yukipan-fs = { path = "crates/domain/yukipan-fs" }
yukipan-limit = { path = "crates/infra/yukipan-limit" }
yukipan-store = { path = "crates/domain/yukipan-store" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
