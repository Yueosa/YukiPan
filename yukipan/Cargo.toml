[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
# 锁定 0.24: 0.25 移除了 lossy WebP 编码 (image-rs/image#1984), 缩略图必须 q80 lossy
image = { version = "=0.24.9", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "webp-encoder",
] }
password-hash = { version = "0.5", features = ["rand_core", "std"] }
libc = "0.2"
redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "script",
] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "migrate",
    "macros",
    "uuid",
    "json",
    "chrono",
    "ipnet",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

yukipan-api = { path = "crates/app/yukipan-api" }
yukipan-config = { path = "crates/infra/yukipan-config" }
yukipan-core = { path = "crates/app/yukipan-core" }
yukipan-db = { path = "crates/infra/yukipan-db" }
yukipan-fs = { path = "crates/domain/yukipan-fs" }
yukipan-limit = { path = "crates/infra/yukipan-limit" }
yukipan-store = { path = "crates/domain/yukipan-store" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
